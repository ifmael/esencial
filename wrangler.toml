# Worker del frontal (B'): sirve los assets del SPA. La API es su propio Worker
# (api/wrangler.toml) y el navegador la llama directamente; aquí solo viven los
# assets y las cabeceras de seguridad que añade web/worker/index.ts.
name = "esencial"
main = "web/worker/index.ts"
compatibility_date = "2026-08-31"

[assets]
directory = "./web/dist"
binding = "ASSETS"
# El Worker DEBE VER cada petición para fijar las cabeceras de seguridad (CSP,
# nosniff, Referrer-Policy) en todas las respuestas; los assets se sirven vía
# env.ASSETS.fetch dentro del Worker.
run_worker_first = true
# Deep links (/plan-recetas) fall through to index.html for the SPA router.
not_found_handling = "single-page-application"

[vars]
# Origen público de la API: se autoriza en la CSP del frontal (fetch e <img>).
API_ORIGIN = "https://esencial-api.nutrirutina.workers.dev"
