# Single Worker: Hono API under /api/* + built SPA static assets (design D1).
name = "esencial"
main = "api/src/index.ts"
compatibility_date = "2026-08-31"

[assets]
directory = "./web/dist"
binding = "ASSETS"
# E7: the Worker must SEE every request to gate HTML pages (pageGuard);
# allowed responses are served via env.ASSETS.fetch inside the Worker.
run_worker_first = true
# Deep links (/plan-recetas) fall through to index.html for the SPA router.
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "esencial"
database_id = "989acff9-fbad-4ef7-a001-695d4966d264"
migrations_dir = "api/migrations"
