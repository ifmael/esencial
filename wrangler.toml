# Worker del frontal (B'): sirve los assets del SPA y hace el guard del HTML.
# La API es su propio Worker (api/wrangler.toml) y el navegador la llama
# directamente; aquí solo viven los assets y el guard.
name = "esencial"
main = "web/worker/index.ts"
compatibility_date = "2026-08-31"
# El guard (web/worker/index.ts) pregunta la sesión a la API con fetch() a su
# URL de workers.dev. Sin este flag, Cloudflare bloquea el fetch entre Workers
# de la misma cuenta (error 1042), el guard lo toma como «sin sesión» y cada
# recarga acaba en /login. En local no pasa (127.0.0.1, otro puerto).
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
# E7: el Worker DEBE VER cada petición para gatear el HTML (guard); las
# respuestas permitidas se sirven vía env.ASSETS.fetch dentro del Worker.
run_worker_first = true
# Deep links (/plan-recetas) fall through to index.html for the SPA router.
not_found_handling = "single-page-application"

[vars]
# Origen público de la API: se autoriza en la CSP del frontal (fetch e <img>).
API_ORIGIN = "https://esencial-api.nutrirutina.workers.dev"
