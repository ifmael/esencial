# Single Worker: Hono API under /api/* + built SPA static assets (design D1).
name = "esencial"
main = "api/src/index.ts"
compatibility_date = "2026-08-31"

[assets]
directory = "./web/dist"
binding = "ASSETS"
# Deep links (/plan-recetas) fall through to index.html.
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "esencial"
# Replace with the real id after `wrangler d1 create esencial` (deploy checklist).
database_id = "00000000-0000-0000-0000-000000000000"
