<div class="flex items-center gap-2">

</div>
</header>
<main class="max-w-md mx-auto px-page-margin mt-4">
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-6">Plan fuerza</h1>

<div class="flex items-center gap-3 mb-section-gap">

<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary-container text-on-primary font-body-md text-body-md font-bold">

            </div>
<span class="material-symbols-outlined text-border text-sm">arrow_forward</span>
<div class="flex items-center justify-center w-8 h-8 rounded-full border border-border text-text-secondary font-body-md text-body-md">
                B
            </div>
<span class="material-symbols-outlined text-border text-sm">arrow_forward</span>
<div class="flex items-center justify-center w-8 h-8 rounded-full border border-border text-text-secondary font-body-md text-body-md">
                C
            </div>
</div>
<!-- Templates List -->
<div class="flex flex-col gap-4">
<!-- Card 1: Expanded / Edit Mode -->
<div class="bg-surface rounded-xl border border-border card-shadow overflow-hidden">
<div class="p-4 border-b border-border bg-surface flex justify-between items-center">
<div class="flex items-center gap-3">

<h2 class="font-headline-md text-headline-md text-text-primary">Empuje</h2>
</div>
<button class="text-text-secondary p-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
<div class="p-0">
<!-- Exercise 1 -->
<div class="flex items-center bg-surface-muted border-b border-border min-h-[48px] px-4 group">
<span class="material-symbols-outlined text-text-secondary cursor-grab mr-3 touch-none">drag_handle</span>
<div class="flex-1 py-3">
<p class="font-body-md text-body-md text-text-primary">Press de banca</p>
<p class="font-label-sm text-label-sm text-text-secondary">3 series</p>
</div>
<button class="text-error p-2 hover:bg-error-container rounded-full transition-colors ml-2">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Exercise 2 -->
<div class="flex items-center bg-surface-muted border-b border-border min-h-[48px] px-4 group">
<span class="material-symbols-outlined text-text-secondary cursor-grab mr-3 touch-none">drag_handle</span>
<div class="flex-1 py-3">
<p class="font-body-md text-body-md text-text-primary">Press militar</p>
<p class="font-label-sm text-label-sm text-text-secondary">3 series</p>
</div>
<button class="text-error p-2 hover:bg-error-container rounded-full transition-colors ml-2">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Exercise 3 -->
<div class="flex items-center bg-surface-muted border-b border-border min-h-[48px] px-4 group">
<span class="material-symbols-outlined text-text-secondary cursor-grab mr-3 touch-none">drag_handle</span>
<div class="flex-1 py-3">
<p class="font-body-md text-body-md text-text-primary">Extensiones tríceps</p>
<p class="font-label-sm text-label-sm text-text-secondary">2 series</p>
</div>
<button class="text-error p-2 hover:bg-error-container rounded-full transition-colors ml-2">
<span class="material-symbols-outlined">delete</span>
</button>
</div>

<button class="w-full flex items-center justify-center gap-2 border border-primary-container text-primary-container font-body-md text-body-md font-bold py-2 rounded-lg hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-sm">add</span>

                        </button>
</div>

<span class="material-symbols-outlined text-sm">content_copy</span>
