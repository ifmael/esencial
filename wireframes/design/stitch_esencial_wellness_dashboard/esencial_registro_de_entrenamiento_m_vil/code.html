<body class="bg-background text-on-background min-h-screen flex flex-col font-sans pb-24">
<!-- TOP APP BAR -->
<header class="w-full top-0 sticky bg-background dark:bg-background flat no shadows z-40">
<div class="flex items-center justify-between px-page-margin h-14 w-full">
<button aria-label="Volver" class="flex items-center justify-center w-11 h-11 text-primary dark:text-primary-fixed-dim hover:opacity-80 active:scale-95 transition-transform rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 text-center">
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">Esencial</h1>
</div>
<button aria-label="Ajustes" class="flex items-center justify-center w-11 h-11 text-primary dark:text-primary-fixed-dim hover:opacity-80 active:scale-95 transition-transform rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<main class="px-page-margin pt-md pb-xxl max-w-[600px] mx-auto w-full">
<!-- HEADER INFO -->
<section class="mb-section-gap flex justify-between items-start">
<div>
<p class="font-label-sm text-label-sm text-text-secondary uppercase tracking-wider mb-xs">Lunes, 1 sep.</p>
<h2 class="font-headline-lg text-headline-lg text-text-primary">Sesión: Empuje A</h2>
</div>
</section>
<!-- STATE A: ACTIVE WORKOUT -->
<div class="space-y-lg" id="state-a">
<!-- EXERCISE 1 -->
<div class="bg-surface rounded-xl border border-border shadow-sm overflow-hidden">
<button class="w-full px-lg py-md flex items-center justify-between hover:bg-surface-muted transition-colors text-left" onclick="toggleDetails('ex1-a')">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary fill-icon">fitness_center</span>
<span class="font-headline-md text-headline-md text-text-primary">Ejercicio 1: Press de banca</span>
</div>
<span class="material-symbols-outlined text-text-secondary transform transition-transform" id="ex1-a-icon">expand_more</span>
</button>
<div class="px-lg pb-lg" id="ex1-a-content">
<p class="font-label-sm text-label-sm text-text-secondary mb-md">última: 57.5kg × 8</p>
<div class="space-y-sm">
<!-- SET 1 -->
<div class="flex items-center justify-between bg-surface-muted p-md rounded-lg">
<span class="font-body-md text-body-md font-semibold text-text-primary w-6">1</span>
<div class="flex items-center gap-2">
<label class="sr-only">Peso</label>
<div class="flex items-center border border-border rounded bg-surface">
<button class="w-8 h-10 flex items-center justify-center text-text-secondary hover:text-primary">-</button>
<input class="w-16 h-10 text-center font-body-md text-body-md border-0 p-0 focus:ring-primary text-text-primary bg-transparent" type="number" value="60"/>
<button class="w-8 h-10 flex items-center justify-center text-text-secondary hover:text-primary">+</button>
</div>
<span class="font-label-sm text-label-sm text-text-secondary w-6">kg</span>
</div>
<div class="flex items-center gap-2">
<label class="sr-only">Repeticiones</label>
<div class="flex items-center border border-border rounded bg-surface">
<button class="w-8 h-10 flex items-center justify-center text-text-secondary hover:text-primary">-</button>
<input class="w-12 h-10 text-center font-body-md text-body-md border-0 p-0 focus:ring-primary text-text-primary bg-transparent" type="number" value="8"/>
<button class="w-8 h-10 flex items-center justify-center text-text-secondary hover:text-primary">+</button>
</div>
<span class="font-label-sm text-label-sm text-text-secondary w-8">reps</span>
</div>
</div>
</div>
<button class="mt-md w-full flex items-center justify-center h-11 text-primary hover:bg-surface-muted rounded-lg transition-colors font-body-md text-body-md font-semibold">
<span class="material-symbols-outlined mr-sm">add</span>
                        Añadir serie
                    </button>
</div>
</div>
<!-- EXERCISE 2 -->
<div class="bg-surface rounded-xl border border-border shadow-sm overflow-hidden">
<button class="w-full px-lg py-md flex items-center justify-between hover:bg-surface-muted transition-colors text-left" onclick="toggleDetails('ex2-a')">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary fill-icon">fitness_center</span>
<span class="font-headline-md text-headline-md text-text-primary">Ejercicio 2: Remo con barra</span>
</div>
<span class="material-symbols-outlined text-text-secondary transform transition-transform" id="ex2-a-icon">expand_more</span>
</button>
<div class="px-lg pb-lg hidden" id="ex2-a-content">
<p class="font-label-sm text-label-sm text-text-secondary mb-md">última: 45kg × 10</p>
<div class="flex items-center justify-between bg-surface-muted p-md rounded-lg">
<span class="font-body-md text-body-md font-semibold text-text-primary w-6">1</span>
<div class="flex items-center gap-2">
<div class="flex items-center border border-border rounded bg-surface">
<input class="w-16 h-10 text-center font-body-md text-body-md border-0 p-0 focus:ring-primary text-text-primary bg-transparent" placeholder="0" type="number"/>
</div>
<span class="font-label-sm text-label-sm text-text-secondary w-6">kg</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center border border-border rounded bg-surface">
<input class="w-12 h-10 text-center font-body-md text-body-md border-0 p-0 focus:ring-primary text-text-primary bg-transparent" placeholder="0" type="number"/>
</div>
<span class="font-label-sm text-label-sm text-text-secondary w-8">reps</span>
</div>
</div>
</div>
</div>
<!-- SESSION COMPLETION DETAILS -->
<div class="bg-surface rounded-xl border border-border shadow-sm p-lg mt-xl">
<h3 class="font-headline-md text-headline-md text-text-primary mb-md">Esfuerzo percibido</h3>
<div class="flex justify-between items-center mb-sm px-2">
<button aria-label="Nivel 1" class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2"></button>
<button aria-label="Nivel 2" class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2"></button>
<button aria-label="Nivel 3" class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2"></button>
<button aria-label="Nivel 4" class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2"></button>
<button aria-label="Nivel 5" class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2"></button>
</div>
<div class="flex justify-between font-label-sm text-label-sm text-text-secondary">
<span>Muy fácil</span>
<span>Máximo</span>
</div>
<div class="mt-lg">
<label class="block font-headline-md text-headline-md text-text-primary mb-sm" for="notes">Notas de la sesión</label>
<textarea class="w-full rounded-lg border-border focus:border-primary focus:ring-primary bg-surface-muted text-text-primary font-body-md text-body-md p-md resize-none" id="notes" placeholder="¿Cómo te sentiste hoy?" rows="3"></textarea>
</div>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary font-headline-md text-headline-md rounded-lg shadow-sm hover:bg-primary-dark transition-colors mt-xl flex items-center justify-center">
                Cerrar sesión
            </button>
</div>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-surface-container border-t border-border dark:border-outline-variant shadow-sm">

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant py-1 hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-lg min-w-[64px] h-[48px] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1">calendar_today</span>

</button>
<!-- Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant py-1 hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-lg min-w-[64px] h-[48px] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1">restaurant_menu</span>
<span class="font-label-sm text-label-sm whitespace-nowrap">Plan recetas</span>
</button>
<!-- Active -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container dark:bg-primary-dark dark:text-on-primary rounded-full px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-container-high min-w-[64px] h-[48px] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1 fill-icon">fitness_center</span>
<span class="font-label-sm text-label-sm whitespace-nowrap">Plan fuerza</span>
</button>
</div>
</nav>
<script>
        function toggleDetails(id) {
            const content = document.getElementById(`${id}-content`);
            const icon = document.getElementById(`${id}-icon`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }
    </script>
</body></html>
