schema: spec-driven

context: |
  App: Esencial — personal wellness web app (recetas + plan de fuerza + vista diaria).
  Stack: Cloudflare Workers (single Worker serves API + SPA). API: Hono + D1 (SQLite).
  Web: React 19 + Vite + react-router 7 + Tailwind v4 (CSS-first; .card/.btn-primary/.input en web/src/globals.css).
  Monorepo pnpm: api/ (Worker), web/ (SPA), tests e2e Playwright (webServer pnpm dev, password dev: hola).
  Deployment: Cloudflare (wrangler); deep links SPA via single-page-application fallback.
  Management site: project-site/ static decision tree (do not mix with app code).

strict_tdd: true

testing:
  unit: vitest
  e2e: playwright

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope one epic per change (E0..E7 per project-site roadmap)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Data model changes MUST include SQLite migration notes
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
