# Worker de la API (B'): Hono + D1 + R2. Sin assets y sin origen compartido con
# el SPA: el navegador llama a esta URL directamente (CORS con credenciales).
name = "esencial-api"
main = "src/index.ts"
compatibility_date = "2026-08-31"

[[d1_databases]]
binding = "DB"
database_name = "esencial"
database_id = "989acff9-fbad-4ef7-a001-695d4966d264"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "esencial-photos"

[vars]
# Origen del Worker de la web autorizado para CORS (CSV). Sin valor no se
# autoriza a nadie (fail closed).
WEB_ORIGIN = "https://esencial.nutrirutina.workers.dev"

# Multi-usuario: en `pnpm dev` no hay Access delante, así que wrangler simula
# la identidad que Access ya probaría en producción (mismo
# ctx.access.getIdentity()). El aud es el de la app de Access de la cuenta. En
# e2e no vale —hace falta más de un usuario— y allí se usa el otro seam:
# X-Dev-Email con DEV_AUTH=1 (fail closed sin el flag).
[access.dev]
aud = "280c84d8f285f6f7b76df01d1c0db07df4dab3be6dcb88e7ff23eac396fe7080"

  [access.dev.identity]
  email = "ismael.rm.1986@gmail.com"

# Preview por rama (M5a): D1 y R2 aislados de producción (una pareja compartida
# por todos los previews; el CLI aplica las migraciones antes de desplegar y pasa
# WEB_ORIGIN con --var). El bloque `env.preview` existe para migrar esa D1.
[[previews.d1_databases]]
binding = "DB"
database_name = "esencial-preview"
database_id = "48c3b2cf-26a9-451c-839a-8a090f364a92"
migrations_dir = "migrations"

[[previews.r2_buckets]]
binding = "PHOTOS"
bucket_name = "esencial-photos-preview"

[env.preview]
name = "esencial-api-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "esencial-preview"
database_id = "48c3b2cf-26a9-451c-839a-8a090f364a92"
migrations_dir = "migrations"
