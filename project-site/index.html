<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esencial — Gestión del proyecto</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4;
    --ok:#15803d; --ok-bg:#dcfce7; --no:#b91c1c; --no-bg:#fee2e2;
    --todo:#a16207; --todo-bg:#fef9c3; --run:#1d4ed8; --run-bg:#dbeafe; }
  * { box-sizing:border-box }
  body { font-family:system-ui,sans-serif; margin:0; padding:2rem 1rem; background:var(--bg); color:var(--fg); }
  main { max-width:52rem; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 .25rem; }
  .updated { color:var(--muted); font-size:.85rem; margin-bottom:1.5rem; }
  details { border-left:2px solid var(--line); padding-left:.9rem; margin-left:.35rem; }
  details[open] > summary { margin-bottom:.35rem; }
  summary { cursor:pointer; padding:.3rem 0; font-weight:600; user-select:none; list-style-position:outside; }
  .node > ul { margin:.2rem 0 .5rem; padding-left:1.1rem; list-style:none; }
  .node > ul li { font-size:.92rem; padding:.12rem 0; }
  .badge { display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.03em;
    padding:.1rem .45rem; border-radius:99px; margin-right:.45rem; vertical-align:1px; text-transform:uppercase; }
  .decidido { color:var(--ok); background:var(--ok-bg); }
  .descartado { color:var(--no); background:var(--no-bg); }
  .pendiente { color:var(--todo); background:var(--todo-bg); }
  .activo { color:var(--run); background:var(--run-bg); }
  .nota { color:var(--muted); }
  .legend { display:flex; gap:1rem; flex-wrap:wrap; margin-top:2rem; color:var(--muted); font-size:.8rem; }
  form { margin-top:2rem; padding:1rem; border:1px solid var(--line); border-radius:.5rem; background:#fff; }
  form label { display:block; font-size:.8rem; font-weight:600; margin:.5rem 0 .15rem; }
  form input, form select { width:100%; max-width:28rem; padding:.35rem .5rem; border:1px solid var(--line); border-radius:.35rem; font:inherit; }
  form button { margin-top:.75rem; padding:.4rem 1rem; border:0; border-radius:.35rem; background:var(--run); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .warn { color:var(--no); font-size:.8rem; margin-top:.4rem; min-height:1em; }
</style>
</head>
<body>
<main>
  <h1>Esencial — Gestión del proyecto</h1>
  <div class="updated">Actualizado: <span id="updated"></span></div>
  <div id="tree"></div>
  <form id="entry-form">
    <label for="f-parent">Nodo de destino</label>
    <select id="f-parent"></select>
    <span class="warn" id="f-warn"></span>
    <label for="f-kind">Tipo</label>
    <select id="f-kind">
      <option value="nota">nota</option>
      <option value="decidido">decidido</option>
      <option value="pendiente">pendiente</option>
      <option value="descartado">descartado</option>
    </select>
    <label><input type="radio" name="f-mode" value="note" checked> anotación</label>
    <label><input type="radio" name="f-mode" value="node"> nodo nuevo</label>
    <div id="f-note-box">
      <label for="f-text">Texto</label>
      <input id="f-text" required>
    </div>
    <div id="f-node-box" hidden>
      <label for="f-title">Título del nodo</label>
      <input id="f-title">
      <label for="f-status">Estado</label>
      <select id="f-status">
        <option value="">(sin estado)</option>
        <option>decidido</option>
        <option>descartado</option>
        <option>pendiente</option>
        <option>activo</option>
      </select>
    </div>
    <button type="submit">Añadir</button>
    <button type="button" id="f-save">Guardar entries.js</button>
  </form>
  <div class="legend">
    <span><span class="badge decidido">decidido</span> decisión tomada</span>
    <span><span class="badge descartado">descartado</span> opción rechazada</span>
    <span><span class="badge pendiente">pendiente</span> por decidir</span>
    <span><span class="badge activo">activo</span> en curso</span>
  </div>
</main>
<script src="data.js"></script>
<script src="entries.js"></script>
<script src="entries-lib.js"></script>
<script src="app.js"></script>
</body>
</html>
