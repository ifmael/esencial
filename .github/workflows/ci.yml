name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESENCIAL_DEV_PASSWORD: hola
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # lee packageManager de package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Migraciones D1 locales
        run: npx wrangler d1 migrations apply esencial --local < /dev/null

      - run: pnpm --filter @esencial/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # lee packageManager de package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint